<!DOCTYPE HTML>

<html>
    <head>
        <meta charset="UTF-8">
        <meta name="description" content="Report a Bug - ScratchVM Web Converter">
        <meta name="keywords" content="Scratch, ESP32, Bug Report">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Report a Bug - ScratchVM Web Converter</title>
        <link rel="stylesheet" href="css/bug-report.css">
    </head>
    <body>
        <nav class="navbar">
            <div class="nav-container">
                <a href="index.html" class="nav-brand">ScratchVM</a>
                <div style="display: flex; align-items: center;">
                    <ul class="nav-links" id="navLinks">
                        <!-- Navigation links will be populated by JavaScript -->
                    </ul>
                </div>
            </div>
        </nav>

        <div class="container">
            <div class="header">
                <h1>Report a Bug</h1>
                <p>Report issues with ScratchVM</p>
            </div>

            <div class="card">
                <h2>Submit a Bug Report</h2>
                <div class="form-group">
                    <label for="bugProjectLink">Scratch Project Link or ID *</label>
                    <input type="text" id="bugProjectLink" 
                           placeholder="https://scratch.mit.edu/projects/123456789" 
                           required>
                </div>

                <div class="form-group">
                    <label for="bugDescription">Description of the Bug *</label>
                    <textarea id="bugDescription" 
                              placeholder="Describe what happened, what you expected to happen, and how to reproduce the bug..." 
                              required></textarea>
                </div>

                <div class="form-group">
                    <label for="bugEmail">Your Email (optional)</label>
                    <input type="email" id="bugEmail" 
                           placeholder="your.email@example.com">
                    <p style="font-size: 0.8em; color: #666; margin-top: 5px;">
                        Provide your email if you'd like to receive updates about this bug.
                    </p>
                </div>

                <div class="button-group">
                    <button id="submitBugReport" class="btn-primary">Submit Bug Report</button>
                </div>

                <div id="bugStatus"></div>
            </div>
        </div>
        
        <div class="footer">
            Site Appearance Generated by Cursor
        </div>
        
        <script type="module" src="navigation.mjs"></script>
        <script type="module" src="bug-report.mjs"></script>
    </body>
</html>
